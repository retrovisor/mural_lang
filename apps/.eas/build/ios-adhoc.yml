# EAS custom build for the native Mural iOS app (apps/ios/Mural.xcodeproj).
# The EAS project root is apps/, so apps/ios/ is the ios/ directory the
# built-in eas/* iOS steps expect. There is no React Native layer, so the
# default node/prebuild/pods steps are skipped on purpose.
build:
  name: Mural iOS (ad hoc)
  steps:
    - eas/checkout

    - run:
        name: Toolchain
        command: |
          xcodebuild -version
          swift --version

    - run:
        name: Offline core tests (MuralCore, XCTest)
        working_directory: ./ios
        command: swift test

    - run:
        name: Resolve pinned Swift packages (WebRTC 152.0.0)
        working_directory: ./ios
        command: xcodebuild -resolvePackageDependencies -project Mural.xcodeproj -scheme Mural

    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id_from_credentials

    - eas/configure_ios_credentials:
        inputs:
          build_configuration: Release

    - eas/generate_gymfile_from_template:
        inputs:
          scheme: Mural
          build_configuration: Release

    - eas/run_fastlane

    - eas/find_and_upload_build_artifacts
